name: Next.js Build and Release

on:
  push:
    branches:
      - nextjs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy public folder
        run: cp -r ./public ./.next/standalone/

      - name: Copy static folder
        run: mkdir -p ./.next/standalone/.next/static && cp -r ./.next/static/* ./.next/standalone/.next/static/

      - name: Archive production artifacts (tar.gz)
        run: tar -czvf build-number-${{ github.run_number }}.tar.gz ./.next/standalone

      - name: Archive production artifacts (zip)
        run: zip -r build-number-${{ github.run_number }}.zip ./.next/standalone

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release №${{ github.run_number }}
          body: It`s ${{ github.run_number }} build! Check commit more info =)
          draft: false
          prerelease: false

      - name: Upload Release Asset (tar.gz)
        id: upload-release-asset-tar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build-number-${{ github.run_number }}.tar.gz
          asset_name: build-number-${{ github.run_number }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload Release Asset (zip)
        id: upload-release-asset-zip
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build-number-${{ github.run_number }}.zip
          asset_name: build-number-${{ github.run_number }}.zip
          asset_content_type: application/zip
